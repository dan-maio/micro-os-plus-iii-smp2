# -----------------------------------------------------------------------------
# The RISC-V Pico 2 (RP2350 on its two Hazard3 cores) through the Raspberry Pi
# Debug Probe (CMSIS-DAP, SWD), for the hardware tests (CMakeLists.txt).
#
# OpenOCD: the Raspberry Pi fork (the pico-sdk's, 0.12.0+dev): its
# target/rp2350-riscv.cfg drives the Hazard3 cores through the RP2350's
# RISC-V debug module; the xPack OpenOCD's riscv target rejects that
# configuration's -dap. The UART is not opened.
# -----------------------------------------------------------------------------

source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0x2e8a 0x000c

# The VisionFive 2's "JTAG probe on Pico" has the same VID:PID. With both
# plugged in, pick this board's by its serial number, UOS_HW_ADAPTER_SERIAL
# (unset: the first one OpenOCD finds).
if {[info exists ::env(UOS_HW_ADAPTER_SERIAL)]} {
  adapter serial $::env(UOS_HW_ADAPTER_SERIAL)
}

adapter speed 5000

gdb port disabled
tcl port disabled
telnet port disabled

source [find target/rp2350-riscv.cfg]
