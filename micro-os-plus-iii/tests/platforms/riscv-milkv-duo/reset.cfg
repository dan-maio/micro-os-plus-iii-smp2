# -----------------------------------------------------------------------------
# reset.cfg -- reset the Milk-V Duo (CV1800B) from OpenOCD, by watchdog.
#
#     openocd -f openocd.cfg -f reset.cfg
#
# The Duo's header has no reset line, so the reset is the one the SoC's own
# boot code uses: BL2's __system_reset() (fsbl/plat/cv180x/platform.c in the
# minimal-boot tree) arms the RTC domain's watchdog-reset path and starts the
# TOP watchdog (DesignWare APB WDT at 0x03010000) with a ~166 ms timeout:
#
#   0x050260E0 <- 0x0001      rtc_core watchdog reset enable
#   0x050260C8 <- 0x0001      rtc_core power cycle enable
#   0x050250AC <- 0x0000      rtcsys_rstn_src_sel
#   0x05025004 <- 0xAB18      RTC_CTRL0 unlock key
#   0x05025008 <- 0x00400040  rtc_ctrl watchdog reset enable
#   0x03010004 <- 0x66        WDT_TORR: ~166 ms
#   0x0301001C <- 0x20
#   0x0301000C <- 0x76        WDT_CRR: restart (kick)
#   0x03010000 <- 0x11        WDT_CR: enable, reset on timeout
#
# (An earlier version used the RTC warm-reset request of the SDK's Linux
# restart handler, cvi-reboot.c. On the board it reset the SoC but the
# board did not come back booted from the SD card; the watchdog path is
# the one BL2 itself relies on.)
#
# Before arming, BL2's boot-source flag in AXI SRAM (0x0E000004, "MGN1/2/3")
# is cleared: SRAM survives a reset, and a stale download flag is a suspect
# (unconfirmed) for the warm reset not booting normally.
#
# The hart is resumed after arming, so the watchdog counts whether or not it
# pauses while the core is debug-halted. The SoC then reboots: boot ROM -> SD
# card (minimal fip: BL2 brings up clocks, DDR, UART4, JTAG pinmux) ->
# OpenSBI parks the hart. JTAG is lost meanwhile (TMS/TCK are on the UART0
# pads until BL2 muxes them), so the session ends with `shutdown`; the next
# one attaches to the rebooted board. Allow ~3-5 s (hw-all.sh does).
# -----------------------------------------------------------------------------

proc cv1800b_wdt_reset {} {
  halt
  # Wherever the hart was (the payload runs in S-mode), write as M-mode.
  reg priv 3

  mww 0x0E000004 0x00000000

  mww 0x050260E0 0x00000001
  mww 0x050260C8 0x00000001
  mww 0x050250AC 0x00000000
  mww 0x05025004 0x0000AB18
  mww 0x05025008 0x00400040

  mww 0x03010004 0x00000066
  mww 0x0301001C 0x00000020
  mww 0x0301000C 0x00000076
  mww 0x03010000 0x00000011

  echo "reset.cfg: watchdog armed (~166 ms)"
  # Let the hart run: the watchdog fires regardless of debug-halt behaviour.
  catch {resume}
}

init
cv1800b_wdt_reset
shutdown
