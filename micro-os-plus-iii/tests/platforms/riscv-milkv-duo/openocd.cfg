# -----------------------------------------------------------------------------
# OpenOCD target for the Milk-V Duo (CV1800B, T-Head C906), over JTAG.
#
# From the cv1800 Eclipse project's openocd-sipeed-cv1800b.cfg (SIPEED RV
# CMSIS-DAP, VID:PID d6e7:3507). No init/halt here: hw.sh drives the session.
#
# JTAG pins on the Duo header (the minimal fip's BL2 muxes them):
#   TDI = pin 1 (GP0)   TDO = pin 2 (GP1)
#   TMS = pin 16 (GP12) TCK = pin 17 (GP13)   GND = pin 18
# There is no nRST/TRST on the header: reset_config none, and a test run is
# one load into an already-booted board (power-cycle between runs).
# -----------------------------------------------------------------------------

adapter driver cmsis-dap
cmsis-dap vid_pid 0xd6e7 0x3507
# 1 MHz: at 4 MHz (the Eclipse cfg) the chain read back garbage over jumper
# wires (phantom TAPs, dtmcontrol 0) on some attaches.
adapter speed 1000
transport select jtag

set _CHIPNAME cv1800b
# T-Head C906: IR length 5, IDCODE 0x10000b6f (mfg 0x5b7, C-SKY Microsystems --
# read from the board; the 0x7e000001 of the Eclipse cfg is not what it reports)
jtag newtap $_CHIPNAME cpu -irlen 5 -expected-id 0x10000b6f

target create $_CHIPNAME.cpu0 riscv -chain-position $_CHIPNAME.cpu -coreid 0

# Top 64 KiB of DDR (linker.ld leaves it free).
$_CHIPNAME.cpu0 configure -work-area-phys 0x83FF0000 -work-area-size 0x10000

# Write the image through the hart (program buffer), i.e. through its
# D-cache, so what the hart then reads is what was loaded. A system-bus
# write would bypass the cache.
riscv set_mem_access progbuf

reset_config none
