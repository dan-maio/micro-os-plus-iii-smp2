# -----------------------------------------------------------------------------
# The WeAct RP2350B (16 MB flash, 8 MB PSRAM) on its two Hazard3 cores,
# through its CMSIS-DAP probe (c251:f001, SWD), for the hardware tests
# (CMakeLists.txt). The target configuration (the RISC-V view, or the Arm
# view for the architecture switch) is added by the command line.
#
# OpenOCD: the Raspberry Pi fork (see platforms/riscv-pico2/openocd.cfg).
# The UART is not opened.
# -----------------------------------------------------------------------------

source [find interface/cmsis-dap.cfg]
cmsis-dap vid_pid 0xc251 0xf001

if {[info exists ::env(UOS_HW_ADAPTER_SERIAL)]} {
  adapter serial $::env(UOS_HW_ADAPTER_SERIAL)
}

adapter speed 1000
set FLASHSIZE 0x1000000

gdb port disabled
tcl port disabled
telnet port disabled
