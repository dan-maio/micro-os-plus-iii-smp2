# -----------------------------------------------------------------------------
# OpenOCD target for the StarFive VisionFive 2 Lite (JH-7110S) over a
# Raspberry Pi "JTAG probe on Pico" (CMSIS-DAP v2, 2e8a:000c), JTAG.
#
# jh7110_daplink.cfg with the probe changed; the rest as measured with the
# DAPLink (2026-11-06):
#   - no init / halt / echo at the end: hw.sh drives the session;
#   - no `target smp`: with the group, OpenOCD's semihosting resumed one hart
#     of four ("3 harts should remain halted, and 1 should resume") and the
#     program's registers were wrong after the first call, every run;
#   - no `-rtos hwthread` (a GDB view of the harts; no GDB here).
# Harts 2..4 stay debug-halted while the test runs on hart 1.
#
# JTAG on the 40-pin header: TMS pin 35, TCK pin 37, TDI pin 38, TDO pin 40,
# GND pin 39. (Pin 36 is GPIO36, not reset.)
# -----------------------------------------------------------------------------

adapter driver cmsis-dap
transport select jtag
# The Raspberry Pi Pico running the "JTAG probe on Pico" firmware:
#   2e8a:000c  iProduct "JTAG probe on Pico (CMSIS-DAP)", CMSIS-DAP v2
#              (vendor-class interface, USB bulk) + a CDC-ACM UART.
# The Raspberry Pi Debug Probe of the Pico 2 tests has the same VID:PID.
# With both plugged in, pick this one by its serial number:
#   PICOPROBE_SERIAL=E4623492931D2230 openocd -f jh7110_picoprobe.cfg ...
cmsis-dap vid_pid 0x2e8a 0x000c
cmsis-dap backend usb_bulk
# The Pico 2's Debug Probe has the same VID:PID: pick this one by its serial
# number, UOS_HW_ADAPTER_SERIAL (the tests' convention) or PICOPROBE_SERIAL
# (the port's former hw.sh); unset, the first one OpenOCD finds.
if {[info exists ::env(UOS_HW_ADAPTER_SERIAL)] && $::env(UOS_HW_ADAPTER_SERIAL) ne ""} {
	adapter serial $::env(UOS_HW_ADAPTER_SERIAL)
} elseif {[info exists ::env(PICOPROBE_SERIAL)] && $::env(PICOPROBE_SERIAL) ne ""} {
	adapter serial $::env(PICOPROBE_SERIAL)
}
# TCK 10 MHz. Measured 2026-11-07 (hw.sh smp-test2, 82 600-byte image):
# 10 MHz 37.4 KiB/s (2.2 s), 2 MHz 30.7 KiB/s (2.6 s); the DAPLink 3.3 KiB/s.
adapter speed 10000

# The scan chain: the E24 TAP first, then the U74-MC TAP.
jtag newtap jh7110 e24_cpu -irlen 5 -expected-id 0x20000c2f
jtag newtap jh7110 u74_cpu -irlen 5 -expected-id 0x07110cfd

# coreid 0 is the S7 monitor hart; the four U74 are mhartid 1..4.
set _CHIPNAME jh7110
target create $_CHIPNAME.cpu1 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 1
target create $_CHIPNAME.cpu2 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 2
target create $_CHIPNAME.cpu3 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 3
target create $_CHIPNAME.cpu4 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 4

# The test runs on cpu1 (riscv-board.hpp BOOT_HART = 1).
targets $_CHIPNAME.cpu1
