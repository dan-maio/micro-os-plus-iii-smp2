# -----------------------------------------------------------------------------
# jh7110_daplink_semihost.cfg -- semihosting-enabled OpenOCD config for the
# StarFive VisionFive 2 Lite (JH-7110S).
#
# This is the board's tested jh7110_daplink.cfg (unchanged) with semihosting
# enabled on all four U74 harts.
#
# IMPORTANT: there is NO `target smp` and NO `-rtos hwthread` here.
#
#   OpenOCD cannot reliably combine its semihosting handler with an SMP
#   group. When one hart of the group hits the semihosting ebreak, OpenOCD
#   handles the call and wants to resume that hart, while the other three
#   harts must stay halted. An SMP group is all-or-nothing, so OpenOCD warns:
#
#       3 harts should remain halted, and 1 should resume.
#
#   and then keeps the whole group halted (measured on this board; the
#   program's registers were wrong after the first semihosting call).
#
#   This file therefore keeps the four harts as INDEPENDENT targets, exactly
#   as the port's hw.sh does. Semihosting on each target is serviced by
#   OpenOCD on its own; there is no group decision to make and no warning.
#
# GDB ports (OpenOCD assigns them in target order):
#
#   jh7110.cpu1 (hart 1, uOS++ CPU 0) -> localhost:3333
#   jh7110.cpu2 (hart 2, uOS++ CPU 1) -> localhost:3334
#   jh7110.cpu3 (hart 3, uOS++ CPU 2) -> localhost:3335
#   jh7110.cpu4 (hart 4, uOS++ CPU 3) -> localhost:3336
#
# For four-hart GDB at once, use jh7110_daplink_debug.cfg instead; that one
# does not use semihosting and works around the console copies with
# `riscv_semihosting_absent` (see smp-start.gdb).
# -----------------------------------------------------------------------------

source [file join [file dirname [info script]] jh7110_daplink.cfg]

# Enable semihosting on every target after OpenOCD has examined it. The
# event handler runs with the issuing target as the current target, so the
# command applies to that hart, not to whichever hart happens to be current.
foreach _t {jh7110.cpu1 jh7110.cpu2 jh7110.cpu3 jh7110.cpu4} {
    $_t configure -event examine-end {
        arm semihosting enable
    }
}
