# -----------------------------------------------------------------------------
# jh7110_picoprobe_debug.cfg -- four-hart GDB debugging of the VisionFive 2 Lite
# (JH-7110S), for smp-start.gdb.
#
# The four U74 harts are ONE SMP group with OpenOCD's hwthread pseudo-RTOS,
# as in the original ~/Desktop/jh7110_daplink.cfg: one GDB server
# (localhost:3333) shows the harts as GDB threads (thread id = coreid + 1,
# so threads 2..5 here), and a halt stops all four.
#
# Do NOT use it with semihosting. With an SMP group, OpenOCD's semihosting
# handler wants to resume one hart while the other three stay halted
# ("3 harts should remain halted, and 1 should resume"), and the program's
# registers were wrong after the first call (measured on this board).
# smp-start.gdb therefore sets riscv_semihosting_absent = 1 before the first
# console write. For semihosting use jh7110_picoprobe_semihost.cfg (four
# independent targets) or test/boards/visionfive2-lite/hw.sh.
#
# Also in an SMP group: `resume <address>` sends EVERY hart to <address>.
# Set each hart's pc first, then resume without an address.
#
# No init / halt here: the debug launch issues them.
#
# JTAG on the 40-pin header: TMS 35, TCK 37, TDI 38, TDO 40, GND 39.
# -----------------------------------------------------------------------------

adapter driver cmsis-dap
transport select jtag
cmsis-dap vid_pid 0x2e8a 0x000c
cmsis-dap backend usb_bulk
if {[info exists ::env(PICOPROBE_SERIAL)] && $::env(PICOPROBE_SERIAL) ne ""} {
	adapter serial $::env(PICOPROBE_SERIAL)
}
adapter speed 10000

# The scan chain as in the original cfg (both TAPs read 0x07110cfd on this
# board; OpenOCD warns about the first and works).
jtag newtap jh7110 e24_cpu -irlen 5 -expected-id 0x20000c2f
jtag newtap jh7110 u74_cpu -irlen 5 -expected-id 0x07110cfd

# coreid 0 is the S7 monitor hart; the four U74 are mhartid 1..4.
set _CHIPNAME jh7110
target create $_CHIPNAME.cpu1 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 1 -rtos hwthread
target create $_CHIPNAME.cpu2 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 2 -rtos hwthread
target create $_CHIPNAME.cpu3 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 3 -rtos hwthread
target create $_CHIPNAME.cpu4 riscv -chain-position $_CHIPNAME.u74_cpu -coreid 4 -rtos hwthread
target smp $_CHIPNAME.cpu1 $_CHIPNAME.cpu2 $_CHIPNAME.cpu3 $_CHIPNAME.cpu4

targets $_CHIPNAME.cpu1
