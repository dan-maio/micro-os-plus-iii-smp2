# -----------------------------------------------------------------------------
# jh7110_wdt_disable.cfg -- stop a watchdog left running by
# jh7110_wdt_reset.cfg after the board has booted again.
#
#     openocd -f jh7110_wdt_disable.cfg
#
# The JH7110 WDT is in the always-on domain; depending on the reset path it
# may survive the SoC reset. If the board keeps rebooting after a watchdog
# reset, attach while it is at U-Boot and run this once.
# -----------------------------------------------------------------------------

source [file join [file dirname [info script]] jh7110_daplink.cfg]

proc jh7110_wdt_disarm {} {
    halt
    reg priv 3

    mww 0x130201e8 0x80000000
    mww 0x130201ec 0x80000000

    mww 0x13070c00 0x1acce551
    mww 0x13070008 0x00000000
    mww 0x13070c00 0xfe533aae

    echo "wdt-disable: watchdog disabled"
    resume
}

init
jh7110_wdt_disarm
shutdown
