# -----------------------------------------------------------------------------
# jh7110_wdt_reset_picoprobe.cfg -- reset the JH-7110 from OpenOCD with its watchdog.
#
#     openocd -f jh7110_wdt_reset_picoprobe.cfg
#
# Why: the RISC-V Debug Module reset (`reset halt` / `reset run`) on this
# board only halts/resumes the U74 harts; it does not reboot the SoC. The
# JH7110 watchdog *does* reset the whole chip, and it is accessible from
# JTAG.
#
# The JH7110 WDT is ARM-SP805-like and LOCKED by default:
#
#   0x13070000  WDOGLOAD      counter load value
#   0x13070004  WDOGVALUE     current counter
#   0x13070008  WDOGCONTROL   bit0 enable, bit1 reset enable
#   0x1307000C  WDOGINTCLR    write 1: clear interrupt, reload
#   0x13070014  WDOGIMS       interrupt status
#   0x13070C00  WDOGLOCK      write 0x1ACCE551 to unlock
#
# (Register layout from the mainline `starfive-wdt.c` driver, JH7110
# variant.)  The count below is ~2 s at a 24 MHz WDT clock (the driver's
# double-timeout behaviour gives ~2x the count).  It is deliberately short:
# the reset-to-uboot script waits only 10 s before disarming the WDT.
# Adjust if your WDT clock differs.
#
# The key sender must already be running: see vf2-reset-to-uboot.sh.
# -----------------------------------------------------------------------------

source [file join [file dirname [info script]] jh7110_picoprobe.cfg]

proc jh7110_wdt_arm {} {
    halt
    reg priv 3

    # WDT APB and core clocks (SYS_CRG Clock WDT APB / Clock WDT).
    mww 0x130201e8 0x80000000
    mww 0x130201ec 0x80000000

    # Unlock the watchdog.
    mww 0x13070c00 0x1acce551

    # Disable first, then enable reset, clear/reload, load, enable.
    mww 0x13070008 0x00000000
    mww 0x13070008 0x00000002
    mww 0x1307000c 0x00000001
    mww 0x13070000 0x016e3600
    mww 0x13070008 0x00000003

    # Lock it again.
    mww 0x13070c00 0xfe533aae

    echo "wdt-reset: watchdog armed; the SoC will reset"
    resume
}

init
jh7110_wdt_arm
shutdown
