# -----------------------------------------------------------------------------
# jh7110_jtag_key.cfg -- inject a U-Boot "key" through UART0 loopback, using
# only JTAG. No UART cable, no external key sender.
#
#     openocd -f jh7110_jtag_key.cfg
#
# U-Boot's autoboot check is just "is a character ready on the console UART?".
# The JH7110 UART0 is a DesignWare 8250 at 0x10000000 (reg-shift 2):
#
#   0x10000000  THR / RBR
#   0x10000010  MCR   bit 4 = loopback
#   0x10000014  LSR   bit 0 = data ready
#
# Setting MCR loopback and writing 0x0D to THR makes the UART receive that
# byte internally. Clearing loopback leaves the byte in the RX FIFO, so
# U-Boot's tstc()/getc() sees a key and aborts autoboot.
#
# Measured on the board:
#   before: LSR = 0x60
#   after:  LSR = 0x61, RBR = 0x0D
# -----------------------------------------------------------------------------

source [file join [file dirname [info script]] jh7110_daplink.cfg]

proc jh7110_jtag_key {} {
    halt
    reg priv 3

    # UART0: loopback + DTR/RTS/OUT2, send CR, restore normal MCR.
    mww 0x10000010 0x13
    mww 0x10000000 0x0d
    mww 0x10000010 0x03

    echo "jtag-key: CR injected into UART0 RX"
    resume
}

init
jh7110_jtag_key
shutdown
