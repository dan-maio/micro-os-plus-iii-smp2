# -----------------------------------------------------------------------------
# jh7110_daplink_srst.cfg -- full board reset through the 40-pin RESET line.
#
# Source this instead of jh7110_daplink.cfg when the probe's RST/SRST pin is
# wired to the board's real reset net (a Reset button net or a documented
# reset test point).  Do NOT use 40-pin pin 36: it is GPIO36 on both the
# VisionFive 2 and the VisionFive 2 Lite; the Lite has no reset button.
#
# The RISC-V Debug Module's `reset halt` / `reset run` on this board only
# halts/resumes the U74 harts; it does not reboot the SoC (measured: the
# U74 PC stayed in the loaded image). A real board reset needs the SRST
# line. With this config, `reset run` asserts SRST, releases it, and the
# board boots from the SD card again.
#
# Wiring: DAPLink RST/SRST -> board reset net; GND -> GND.
# Do NOT wire it to 40-pin pin 36 (GPIO36).
# -----------------------------------------------------------------------------

source [file join [file dirname [info script]] jh7110_daplink.cfg]

# The probe drives SRST; do not gate it with the JTAG state.
reset_config srst_only srst_nogate
